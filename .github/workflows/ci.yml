name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3 shellcheck
      - name: Syntax check
        run: for script in bin/*.sh bin/sesh install.sh tests/*.sh scripts/*.sh; do bash -n "$script"; done
      - name: ShellCheck (errors)
        run: shellcheck -x --severity=error bin/*.sh bin/sesh install.sh tests/sesh.sh tests/changelog.sh scripts/changelog.sh
      - name: Regression suite
        run: ./tests/sesh.sh
      - name: Changelog tooling
        run: ./tests/changelog.sh
      - name: CHANGELOG structure
        run: bash scripts/changelog.sh check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # stripTypeScriptTypes needs Node 22.6+, hence Node 24 on this job.
      - name: TUI data-layer contract
        run: node tests/tui.mjs

  package:
    name: package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify publishable tarball
        run: |
          npm pack --dry-run
          test -f bin/sesh
          test -f dist/tui.js

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            from=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            from="${{ github.event.before }}"
            case "$from" in 0000000*) from="HEAD~1" ;; esac
          fi
          bunx commitlint --from "$from" --to HEAD --verbose

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
