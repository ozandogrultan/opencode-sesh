name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3 shellcheck
      - name: Syntax check
        run: bash -n bin/*.sh bin/sesh install.sh tests/sesh.sh
      - name: ShellCheck (errors)
        run: shellcheck -x --severity=error bin/*.sh bin/sesh install.sh tests/sesh.sh
      - name: Regression suite
        run: ./tests/sesh.sh

  typecheck:
    name: tui typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
