name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the new release
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: cut and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure there is something to release
        run: |
          bash scripts/changelog.sh draft > "$RUNNER_TEMP/draft.md"
          if [ -s "$RUNNER_TEMP/draft.md" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No notable commits since the last release; nothing to release."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
        id: draft
      - name: Bump version, write the changelog and tag
        if: steps.draft.outputs.ok == '1'
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(npm version "$BUMP" --no-git-tag-version | tail -n 1)"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected npm version output: $version"; exit 1 ;;
          esac
          bash scripts/changelog.sh release "${version#v}"
          bash scripts/changelog.sh check
          bash scripts/changelog.sh notes "$version" > /dev/null
          git add package.json CHANGELOG.md
          git commit -m "$version"
          git tag -a "$version" -m "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Push commit and tag
        if: steps.draft.outputs.ok == '1'
        # Tags pushed with GITHUB_TOKEN do not trigger this workflow again; the
        # publish job below picks the tag up from this job's output instead.
        run: git push --atomic --follow-tags

  publish:
    name: publish release
    needs: cut
    # Runs for a pushed tag (cut is skipped) or after a cut that produced a tag.
    # A failed publish is retried with "Re-run failed jobs" without re-cutting.
    if: >-
      !cancelled() && (github.event_name == 'push' ||
      (needs.cut.result == 'success' && needs.cut.outputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.cut.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Trusted publishing needs npm >= 11.5.1 (newer than Node 20 ships).
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - name: Check whether the version is already published
        id: published
        run: |
          version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag version ($version) does not match package.json version ($pkg_version)."
            exit 1
          fi
          pkg=$(node -p "require('./package.json').name")
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version is already on npm; skipping publish."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.exists == '0'
        # npm (not bun) because trusted publishing authenticates with the OIDC
        # id-token and attaches provenance automatically (package Trusted
        # Publisher settings). No token is stored in the repo.
        run: npm publish --provenance --access public
      - name: Prepare release notes
        id: notes
        run: |
          if bash scripts/changelog.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "::notice::using the CHANGELOG.md section for $TAG"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no usable section for $TAG; falling back to generated notes"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE: ${{ steps.notes.outputs.have }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$HAVE" = "1" ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release edit "$TAG" --title "$TAG"
            fi
          elif [ "$HAVE" = "1" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
