name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the new release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

# Serialize release cuts: a second dispatch waits instead of racing the first
# into a duplicate bump/publish. The queued run then finds [Unreleased] empty
# and no-ops (see the guard in the cut job).
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  tagged:
    name: publish tagged release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1 (newer than Node 20 ships).
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - name: Check whether the version is already published
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').name")
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$pkg@$version is already on npm; skipping publish."
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.published.outputs.exists == '0'
        # npm (not bun) because trusted publishing authenticates with the OIDC
        # id-token and attaches provenance automatically (package Trusted
        # Publisher settings). No token is stored in the repo.
        run: npm publish --provenance --access public
      - name: Prepare release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          if bash scripts/changelog.sh notes "$tag" > "$RUNNER_TEMP/notes.md"; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "::notice::using the CHANGELOG.md section for $tag"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md has no usable section for $tag; falling back to generated notes"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          have="${{ steps.notes.outputs.have }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$have" = "1" ]; then
              gh release edit "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release edit "$tag" --title "$tag"
            fi
          elif [ "$have" = "1" ]; then
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi

  cut:
    name: cut, tag, publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq sqlite3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure there is something to release
        # A queued duplicate dispatch starts after the first cut has promoted
        # [Unreleased], so it lands here with nothing to announce. Treat that as
        # a clean no-op instead of a second bump. `notes` exits non-zero when
        # the section is missing or empty.
        run: |
          if bash scripts/changelog.sh notes > /dev/null 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CHANGELOG.md [Unreleased] is empty; nothing to release."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
        id: unreleased
      - name: Bump version, promote the changelog and tag
        if: steps.unreleased.outputs.ok == '1'
        id: version
        run: |
          # npm only writes the version fields: the release commit has to carry
          # the promoted changelog section too, so the commit is made here.
          version="$(npm version "${{ inputs.bump }}" --no-git-tag-version | tail -n 1)"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected npm version output: $version"; exit 1 ;;
          esac
          bash scripts/changelog.sh promote "${version#v}"
          bash scripts/changelog.sh check
          # The release body is the section just promoted, so fail before
          # pushing or publishing when there is nothing to announce.
          bash scripts/changelog.sh notes "$version" > /dev/null
          git add -A
          git commit -m "$version"
          git tag -a "$version" -m "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Push commit and tag
        if: steps.unreleased.outputs.ok == '1'
        # Tags pushed with GITHUB_TOKEN do not re-trigger this workflow, so the
        # publish below is the only one for this release.
        run: git push --follow-tags
      - name: Publish to npm
        if: steps.unreleased.outputs.ok == '1'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        if: steps.unreleased.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          bash scripts/changelog.sh notes "$tag" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
