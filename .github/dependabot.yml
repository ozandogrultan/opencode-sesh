version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @opentui/keymap pins an exact solid-js peer, so it can only move in
      # lockstep with OpenTUI (bump it in the opentui group instead).
      - dependency-name: solid-js
    groups:
      opentui:
        patterns:
          - "@opentui/*"
      opencode:
        patterns:
          - "@opencode-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
