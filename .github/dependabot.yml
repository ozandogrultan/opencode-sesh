version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      # @opentui/keymap pins an exact solid-js peer, so it can only move in
      # lockstep with OpenTUI (bump it in the opentui group instead).
      - dependency-name: solid-js
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    groups:
      opentui:
        patterns:
          - "@opentui/*"
      opencode:
        patterns:
          - "@opencode/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
