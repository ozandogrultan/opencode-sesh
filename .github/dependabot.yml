version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      opentui:
        patterns:
          - "@opentui/*"
      opencode:
        patterns:
          - "@opencode-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
